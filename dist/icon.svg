<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="115" fill="#0A0A0F" />
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="#0A0A0F" />
  <image href="data:image/jpeg;base64," x="0" y="0" width="512" height="512" clip-path="url(#roundedClip)" preserveAspectRatio="xMidYMid slice" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(0,163,255,0.45)" stroke-width="6" />
</svg>