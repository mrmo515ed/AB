# Anime Black — Gradle version catalog.
# All versions are pinned (no dynamic versions). They were verified as the latest *stable* releases
# against Google Maven / Maven Central metadata on the CI runner (see android/ci-reports/REPORT.md).

[versions]
# Toolchain (AGP 9 uses built-in Kotlin; KGP is pinned through the plugins below)
androidGradlePlugin = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"

# Android SDK levels
compileSdk = "36"
targetSdk = "36"
minSdk = "26"

# AndroidX
androidxCore = "1.19.1"
androidxCoreSplashscreen = "1.2.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxHilt = "1.4.0"
androidxWork = "2.12.0"
androidxRoom = "2.8.5"
androidxDataStore = "1.2.1"
androidxPaging = "3.5.1"
androidxMedia3 = "1.11.1"
androidxCamera = "1.6.2"
androidxCredentials = "1.6.0"
androidxExifInterface = "1.4.2"
androidxProfileInstaller = "1.4.1"
androidxBrowser = "1.10.0"
androidxComposeBom = "2026.09.00"
androidxComposeMaterial3Adaptive = "1.3.0"

# Google / Firebase
firebaseBom = "34.19.0"
googleServicesPlugin = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
firebasePerfPlugin = "2.0.2"
googleId = "1.2.1"

# DI
hilt = "2.60.1"

# Kotlin libraries
kotlinxCoroutines = "1.11.0"
