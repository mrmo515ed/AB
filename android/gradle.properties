# Gradle
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Optional build inputs (override in ~/.gradle/gradle.properties or with -P / environment):
