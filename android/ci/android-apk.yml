# Reference GitHub Actions workflow for the native Android app.
#
# The Arena session token cannot create files under .github/workflows, so the APK is currently
# built by the existing CI job (`npm run build` -> android/scripts/ci-android.mjs). To use a
# dedicated workflow instead, copy this file to .github/workflows/android-apk.yml.
#
# Release signing (optional): add repository secrets
#   ANDROID_KEYSTORE_BASE64, ANIMEBLACK_RELEASE_STOREPASSWORD,
#   ANIMEBLACK_RELEASE_KEYALIAS, ANIMEBLACK_RELEASE_KEYPASSWORD
# and optionally ANIMEBLACK_APIBASEURL (https URL of the Node server for the AI agent).
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug testDebugUnitTest --stacktrace
        env:
          ANIMEBLACK_APIBASEURL: ${{ secrets.ANIMEBLACK_APIBASEURL }}

      - name: Decode release keystore
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANIMEBLACK_RELEASE_STOREFILE: ${{ runner.temp }}/release.jks
          ANIMEBLACK_RELEASE_STOREPASSWORD: ${{ secrets.ANIMEBLACK_RELEASE_STOREPASSWORD }}
          ANIMEBLACK_RELEASE_KEYALIAS: ${{ secrets.ANIMEBLACK_RELEASE_KEYALIAS }}
          ANIMEBLACK_RELEASE_KEYPASSWORD: ${{ secrets.ANIMEBLACK_RELEASE_KEYPASSWORD }}
          ANIMEBLACK_APIBASEURL: ${{ secrets.ANIMEBLACK_APIBASEURL }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: anime-black-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: android/**/build/reports/tests/
